name: Build Multi-Package Car Release

on:
  push:
    tags:
      - 'car-multi-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - package: com.tencent.ibg.joox
            label: joox
          - package: com.spotify.music
            label: spotify
          - package: com.apple.android.music
            label: apple
          - package: com.luna.music.car
            label: luna
          - package: com.kugou.android.auto
            label: kugou
          - package: cn.kuwo.kwmusiccar
            label: kuwo
          - package: com.qidian.QDReader
            label: qidian
          - package: com.tencent.weread
            label: weread
          - package: cn.aqzscn.stream_music
            label: aqzscn
          - package: com.tencent.wecarflow
            label: wecarflow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        run: |
          mkdir -p /opt/apktool
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /opt/apktool/apktool.jar
          echo "APKTOOL=/opt/apktool/apktool.jar" >> $GITHUB_ENV

      - name: Install Android build-tools (apksigner)
        run: |
          mkdir -p /opt/bt && cd /opt/bt
          wget -q https://dl.google.com/android/repository/build-tools_r34-linux.zip -O bt.zip
          unzip -q bt.zip -d /opt/bt
          echo "APKSIGNER=$(find /opt/bt -name apksigner | head -1)" >> $GITHUB_ENV

      - name: Repackage (change applicationId)
        if: matrix.package != 'com.luna.music.car'
        run: |
          python3 tools/repackage.py ${{ matrix.package }} .
          echo "Verifying package change..."
          grep -q 'package="${{ matrix.package }}"' AndroidManifest.xml || { echo "ERROR: Package not changed correctly"; exit 1; }
          echo "Package changed to ${{ matrix.package }}"

      - name: Build APK (apktool, x86_64 native aapt2)
        run: |
          java -jar "$APKTOOL" b . -o /tmp/unsigned.apk --use-aapt2
          ls -la /tmp/unsigned.apk

      - name: Zipalign (4-byte alignment for resources.arsc)
        run: |
          ZIPALIGN=$(find /opt/bt -name zipalign | head -1)
          "$ZIPALIGN" -f -p 4 /tmp/unsigned.apk /tmp/aligned.apk
          "$ZIPALIGN" -c -p 4 /tmp/aligned.apk
          echo "Zipalign verification passed"

      - name: Validate package-specific lyric protocols
        shell: bash
        run: |
          set -euo pipefail
          CHECK_DIR=/tmp/protocol-check
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          unzip -q /tmp/aligned.apk 'classes*.dex' -d "$CHECK_DIR"

          contains_key() {
            local key="$1"
            local dex hits
            for dex in "$CHECK_DIR"/classes*.dex; do
              # grep -c reads all input, so no SIGPIPE under `set -o pipefail`
              # (grep -q would exit early, kill `strings` with 141 and break the check)
              hits=$(strings "$dex" | grep -Fc -- "$key" || true)
              if [[ "${hits:-0}" -gt 0 ]]; then
                return 0
              fi
            done
            return 1
          }

          require_key() {
            contains_key "$1" || { echo "ERROR: missing protocol key: $1"; exit 1; }
          }

          forbid_key() {
            if contains_key "$1"; then
              echo "ERROR: forbidden single-line key remains: $1"
              exit 1
            fi
          }

          # Every package must provide the ucar whole-LRC path.
          require_key "ucar.media.metadata.LYRICS_WHOLE"
          forbid_key "ucar.media.metadata.LYRICS_LINE"
          forbid_key "music.media.extras.LYRIC"
          forbid_key "music.media.extras.LYRIC_IS_ALLOWED"
          forbid_key "music.media.extras.NOTICE_CAR"

          # growcar-cover v1.1.14: 封面竞态保护符号必须存在于每个包（防回归）。
          require_key "bumpCoverRev"
          require_key "ensureCoverFlushed"
          require_key "sCoverMeta"
          require_key "sCoverRev"

          # Atomic lyrics are guaranteed only for Apple Music and Spotify.
          if [[ "${{ matrix.package }}" == "com.apple.android.music" || \
                "${{ matrix.package }}" == "com.spotify.music" ]]; then
            AAPT2=$(find /opt/bt -name aapt2 | head -1)
            if ! "$AAPT2" dump xmltree /tmp/aligned.apk --file AndroidManifest.xml \
                 | grep -Fc -- "com.vivo.musicwidgetmix.support.service" > /dev/null; then
              echo "ERROR: missing atomic MediaBrowserService action"
              exit 1
            fi
            require_key "vivomusicmix.media.metadata.support_event"
            require_key "vivomusicmix.meida.extra.key.action"
            require_key "vivomusicmix.extra.lrc_change"
            require_key "vivomusicmix.extra.key.lyric"
            require_key "vivomusicmix.extra.key.meidia_id"
            echo "Atomic lyric validation passed for ${{ matrix.package }}"
          else
            echo "Atomic lyric validation skipped for ${{ matrix.package }} (not guaranteed)"
          fi

          echo "CarLink whole-LRC validation passed for ${{ matrix.package }}"

      - name: Sign APK
        run: |
          base64 -d keystore/car-release.keystore.b64 > /tmp/car-release.keystore
          chmod 600 /tmp/car-release.keystore
          OUTNAME="SamsungMusic_Car_${{ matrix.label }}_16.2.45.1.apk"
          "$APKSIGNER" sign --ks /tmp/car-release.keystore \
            --ks-key-alias luna_car \
            --ks-pass pass:grow-car-2026 \
            --key-pass pass:grow-car-2026 \
            --out "/tmp/$OUTNAME" /tmp/aligned.apk
          ls -la "/tmp/$OUTNAME"
          echo "OUTNAME=$OUTNAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.label }}
          path: /tmp/${{ env.OUTNAME }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all apks
        uses: actions/download-artifact@v4
        with:
          path: /tmp/pkg
          merge-multiple: true

      - name: Publish single release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/pkg/*.apk
          tag_name: ${{ github.ref_name }}
          name: Samsung Music Car-vivo 16.2.45.1 (Multi-Package)
          body: |
            Samsung Music 16.2.45.1 · vivo 车载投屏歌词适配 · 10 个包名版本。
            全部包名保证 vivo 车联投屏整段 LRC 滚动歌词；仅 Apple Music / Spotify
            额外保证原子随身听歌词。签名：car-release（可覆盖安装历史版本）。

